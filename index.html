<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta
      name="description"
      content="Gemeinsame Warenkörbe und Bestelllisten – schnell, sicher, mit automatischer Produktauflösung und USD/EUR-Umrechnung."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Warenkorb &amp; Bestelllisten</title>
    <script>
      // SPA fallback for GitHub Pages deep-links, see public/404.html.
      (function () {
        var redirect = sessionStorage.getItem("spa-redirect");
        if (redirect) {
          sessionStorage.removeItem("spa-redirect");
          var current = location.pathname + location.search + location.hash;
          if (redirect !== current) {
            history.replaceState(null, "", redirect);
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Diese Anwendung benötigt aktiviertes JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
