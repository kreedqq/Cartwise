# Minimal Supabase CLI config for local development (`supabase start`).
# See https://supabase.com/docs/guides/cli/config for the full reference.
# Local ports avoid Windows Hyper-V excluded ranges (e.g. 54258–54357),
# which block the default 54321–54327 binds on some developer machines.
# This file never targets production; do not use --linked with these ports.
project_id = "shared-cart-app"

[api]
enabled = true
port = 55421
schemas = ["public", "storage"]

[db]
port = 55422
shadow_port = 55420

[studio]
enabled = true
port = 55423

[inbucket]
enabled = true
port = 55424

[analytics]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false # set true to mirror a production project that requires email verification

[storage]
enabled = true
file_size_limit = "10MiB"

[edge_runtime]
enabled = true
