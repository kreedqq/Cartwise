# Minimal Supabase CLI config for local development (`supabase start`).
# See https://supabase.com/docs/guides/cli/config for the full reference.
project_id = "shared-cart-app"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]

[db]
port = 54322

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false # set true to mirror a production project that requires email verification

[storage]
enabled = true
file_size_limit = "10MiB"

[edge_runtime]
enabled = true
